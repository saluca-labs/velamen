[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velamen"
version = "0.1.0"
description = "Steganographic communication over LLM token distributions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Saluca LLC", email = "oss@saluca.com" },
]
keywords = ["steganography", "llm", "arithmetic-coding", "covert-channel", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.33.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=49.0.0"]
dev = [
    "cryptography>=49.0.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
velamen = "velamen.cli:main"

[project.urls]
Homepage = "https://github.com/saluca-labs/velamen"
Documentation = "https://github.com/saluca-labs/velamen/tree/main/docs"
Issues = "https://github.com/saluca-labs/velamen/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Keep the rule set this repo was written against. Newer ruff releases widened
# the default selection, which turned an unchanged tree red.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"velamen/stego.py" = ["E702"]  # semicolons idiomatic in arithmetic coding loops
